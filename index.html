<!-- ════════════════════════════════════════════════════════════════
     Phase 22-A (2026-05-23) — app-shell top-bar pill SCAFFOLD
     ════════════════════════════════════════════════════════════════
     The elegant dual-pill that will eventually replace the in-Forge
     bottom-bar "FORGE | Deities" pill. This Phase ships pure HTML+CSS
     scaffold — the dropdowns exist but DO NOTHING YET (no click
     handlers wired). Master-view selector + class selector behavior
     comes in Phase 22-B + 22-C respectively. Old Forge pill remains
     fully functional during the transition. Per AUDIT/topbar-pill-
     refactor-design-2026-05-23.md §2 visual spec.

     Construction: ONE pill-shaped <div> containing TWO independent
     click targets (.app-pill-master + .app-pill-class) fused by a
     vertical `|` divider. Two dropdown panels (one per side) anchor
     to the pill's bottom-left + bottom-right edges. The pill is
     always-on (every view shows it); class side will hide for views
     that don't support class-filtering (Phase 22-C).
     ════════════════════════════════════════════════════════════════ -->
<div class="app-pill-wrap" id="app-pill-wrap" aria-label="Master view and class">
  <div class="app-pill" role="group">
    <button class="app-pill-side app-pill-master" id="app-pill-master" type="button"
            aria-haspopup="menu" aria-expanded="false" aria-controls="app-pill-master-menu"
            title="Master view — Atlas / Timeline / Map / Star Map">
      <span class="app-pill-icon" aria-hidden="true">⚒</span>
      <span class="app-pill-label" id="app-pill-master-label">ATLAS</span>
      <span class="app-pill-caret" aria-hidden="true">▾</span>
    </button>
    <span class="app-pill-divider" aria-hidden="true"></span>
    <button class="app-pill-side app-pill-class" id="app-pill-class" type="button"
            aria-haspopup="menu" aria-expanded="false" aria-controls="app-pill-class-menu"
            title="Class filter — Deities / Persons / Themes / etc.">
      <span class="app-pill-label" id="app-pill-class-label">Deities</span>
      <span class="app-pill-caret" aria-hidden="true">▾</span>
    </button>
  </div>
  <!-- Master-view dropdown (anchored to .app-pill-master bottom-left).
       Items populated in Phase 22-B; scaffold for now. -->
  <div class="app-pill-menu app-pill-menu--master" id="app-pill-master-menu"
       role="menu" aria-hidden="true"></div>
  <!-- Class dropdown (anchored to .app-pill-class bottom-right).
       Items populated in Phase 22-C; scaffold for now. -->
  <div class="app-pill-menu app-pill-menu--class" id="app-pill-class-menu"
       role="menu" aria-hidden="true"></div>
</div>

<main class="canvas" id="canvas">
  <div class="view-header">
    <div>
      <h2 id="view-title">Pantheon</h2>
      <span class="subtitle" id="view-subtitle">every named deity · radial family wedges · hover to focus</span>
    </div>
    <div class="view-controls" id="view-controls"></div>
  </div>
  <div id="svg-wrap"><svg id="svg"></svg></div>
  <!-- Shared WebGL graph canvas (sigma.js) — outer pane owns positioning so sigma's
       internal canvas can resize freely. Hidden except on graph views (pantheon for
       Phase 1; documents/scripture/alchemy added in later phases). -->
  <div class="codex-graph-pane" id="codex-graph-pane" style="display:none"></div>
  <!-- Atlas Map (MapLibre GL) — outer pane owns positioning; inner div is the MapLibre target.
       Nesting is required because MapLibre sets `position: relative` inline on its container,
       which would otherwise defeat our `position: absolute; inset: 0` fill rule. -->
  <div class="atlas-pane" id="atlas-pane" style="display:none">
    <div class="atlas-map" id="atlas-map"></div>
  </div>
  <!-- Scripture Reader — shown when STATE.scriptureReaderMode is set.
       Rendered by src/js/views/scripture-reader.js into this pane.
       Hidden by setView() on every view transition. -->
  <div id="scripture-reader-pane" style="display:none"></div>
  <div class="legend" id="legend" style="display:none"></div>
  <!-- Tier-overlay distribution legend — shown only when body.tier-overlay-on. Populated by JS on toggle. -->
  <div class="tier-legend" id="tier-legend" aria-live="polite"></div>
  <div class="map-thumb" id="map-thumb" style="display:none">
    <svg viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet" id="map-thumb-svg">
      <!-- Equirectangular world: lon ∈ [-180,180] maps x ∈ [0,360]; lat ∈ [-90,90] maps y ∈ [180,0] -->
      <rect x="0" y="0" width="360" height="180" fill="rgba(13,17,25,0.55)"/>
      <g id="map-thumb-paths" stroke="rgba(212,165,90,0.30)" stroke-width="0.5" fill="rgba(212,165,90,0.06)"></g>
      <g id="map-thumb-marker"></g>
    </svg>
    <div class="map-thumb-label" id="map-thumb-label"></div>
  </div>
  <div class="tooltip" id="tooltip"></div>
  <div class="zoom-meter" id="zoom-meter" style="display:none" title="Current zoom · click 1× to recenter">
    <button class="zm-step" id="zm-out" aria-label="zoom out">−</button>
    <button class="zm-baseline" id="zm-reset" title="recenter / reset to 100%">100%</button>
    <button class="zm-step" id="zm-in" aria-label="zoom in">+</button>
    <span class="zm-readout" id="zm-readout">1.00×</span>
  </div>
</main>
