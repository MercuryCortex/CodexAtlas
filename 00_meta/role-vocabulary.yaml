# Role Controlled Vocabulary
#
# Built 2026-05-31 per AUDIT/2026-05-31-figures-migration-plan-v3.md.
# Mirrors 00_meta/tradition-vocabulary.yaml schema. The FIRST INSTANCE of the
# reusable controlled-vocabulary primitive per HOW-WE-WORK §5 rule #11 +
# v3 plan §9.5 (architectural directive — future controlled-vocab fields
# inherit this same shape).
#
# Anchored in Eliade/Jones 2005 *Encyclopedia of Religion* 2nd ed. (Macmillan,
# 15 vols) — the religious-studies discipline's reference of record — with
# Smart 1996 *Dimensions of the Sacred* + Weber 1922 *Economy and Society*
# Vol. 2 chs. VI + XIV as co-primary for the typology of religious actors.
# Asad 1993 *Genealogies of Religion* is the methodological caveat:
# all such typologies are Christian-derived universals that imperfectly map
# onto Islamic / Hindu / Buddhist / Indigenous emic categories. The
# role-tokens: field is the etic spine; the prose role-description: field
# preserves tradition-internal nuance.
#
# Per-tradition specialists cited where applicable. Bowker 1997
# *Oxford Dictionary of World Religions* used as tertiary cross-check.
#
# Schema for each entry (locked 2026-05-31, controlled-vocab primitive #1):
#   - id:                 lowercase slug (the canonical identifier)
#   - display:            human-readable label for UI
#   - tier:               1-5 per the v3 plan taxonomy
#   - figure_qualifying:  bool — does this role qualify a person for the Figures lens
#   - source-tier:        T1-T4 per methodology.md §Source-integrity policy
#   - source:             primary Tier-1 reference defining the category
#   - secondary:          optional list of secondary references
#   - notes:              scope boundary / disambiguation / cross-tradition caveats
#   - aliases:            free-text strings observed in current node YAML that
#                          resolve to this id (normalization input for the
#                          generic build_data.py + migrate_roles.py)

field_name: role-tokens
node_type_scope: ["person"]
allow_array: true
lens_qualifying_flag: figure_qualifying

# Anchor declaration (machine-readable for methodology.md cross-link)
anchor:
  primary:
    - citation: "Jones, Lindsay (ed.) 2005. Encyclopedia of Religion (2nd ed.). 15 vols. Macmillan Reference."
      role: "comparative-religion classification spine"
    - citation: "Smart, Ninian 1996. Dimensions of the Sacred. University of California Press."
      role: "co-primary for typology of religious actors"
    - citation: "Weber, Max 1922/1978. Economy and Society. University of California Press. Vol. 2 chs. VI + XIV."
      role: "sociology-of-religion foundational typology (prophet/priest/magician/sage)"
  methodological_caveat:
    citation: "Asad, Talal 1993. Genealogies of Religion: Discipline and Reasons of Power in Christianity and Islam. Johns Hopkins University Press."
    note: "All such typologies are Christian-derived universals that imperfectly map onto Islamic/Hindu/Buddhist/Indigenous emic categories. role-tokens: is the etic spine; role-description: preserves emic nuance."
  tertiary:
    - citation: "Bowker, John (ed.) 1997. The Oxford Dictionary of World Religions. Oxford University Press."
      role: "entry-level cross-check lookup"

entries:

  # ────────────────────────────────────────────────────────────────────────
  # TIER 1 — Founders + revelation-bearers + tradition-defining figures
  # ────────────────────────────────────────────────────────────────────────

  - id: founder
    display: "Founder of a tradition"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Jones 2005 *Encyclopedia of Religion* entry 'Founders of Religions'"
    secondary: ["Smart 1996 *Dimensions of the Sacred*", "Hammer 2001 *Claiming Knowledge*"]
    notes: "Generic founder category. Used when no more specific Tier-1 token applies. Multi-role with prophet-*/avatar-*/manifestation-* when appropriate."
    aliases: ["founder", "founder / prophet", "founder / Wicca", "founder / occultist / poet"]

  - id: prophet-abrahamic
    display: "Prophet (Abrahamic — Hebrew / Christian / Islamic)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Heschel, Abraham Joshua 1962. The Prophets. Jewish Publication Society."
    secondary: ["Crone, Patricia 2004. God's Rule: Government and Islam. Columbia UP.", "Jones 2005 entry 'Prophecy'"]
    notes: "Hebrew Bible navi, NT prophet, Quranic nabi. Distinct from prophet-indigenous (Ghost Dance, Longhouse Religion) and prophet-non-abrahamic (modern revelation-bearers outside Abrahamic and Indigenous frameworks). Do NOT apply to Joseph Smith (LDS doctrinal claim, not academic-neutral) or Bahá'u'lláh (use manifestation-bahai)."
    aliases: ["prophet", "prophet | messenger", "Hebrew prophet", "Old Testament prophet", "biblical prophet"]

  - id: prophet-indigenous
    display: "Prophet (Indigenous-tradition revelation-bearer)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Hittman, Michael 1990. Wovoka and the Ghost Dance. University of Nebraska Press."
    secondary: ["Wallace, Anthony F.C. 1969. The Death and Rebirth of the Seneca. Vintage.", "Mooney, James 1896. The Ghost-Dance Religion and the Sioux Outbreak of 1890. Bureau of American Ethnology."]
    notes: "Wovoka, Smohalla, Handsome Lake, Tenskwatawa, Black Hawk. Ghost Dance + Longhouse Religion + Indian Shaker Church revelation-bearers. **CARDINAL: NOT prophet-abrahamic.** Calling Wovoka an Abrahamic prophet is colonial framing — per Auditor B 2026-05-31."
    aliases: ["Northern Paiute prophet", "Ghost Dance prophet", "indigenous prophet"]

  - id: prophet-non-abrahamic
    display: "Prophet (modern non-Abrahamic, non-Indigenous revelation-bearer)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Bogdan & Starr 2012 *Aleister Crowley and Western Esotericism*. Oxford UP."
    secondary: ["Gottschalk, Stephen 1973. The Emergence of Christian Science in American Religious Life. UC Press.", "Hammer 2001 *Claiming Knowledge*"]
    notes: "Modern revelation-bearer outside Abrahamic and Indigenous frameworks. Crowley (Liber AL), Mary Baker Eddy (Science and Health). The category exists to give Tier-1 acknowledgement without smuggling Abrahamic-prophet framing onto NRM founders."
    aliases: []

  - id: messenger-islamic
    display: "Messenger (Islamic rasūl)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Crone 2004 *God's Rule*"
    secondary: ["Bowker 1997 entry 'rasul'"]
    notes: "Islamic theological category for revelation-bearer-with-scripture. Muhammad is both prophet-abrahamic AND messenger-islamic. Distinct from generic prophet-abrahamic."
    aliases: ["rasul", "messenger of Allah"]

  - id: manifestation-bahai
    display: "Manifestation of God (Bahá'í maẓhar-i ilāhī)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Smith, Peter 2008. An Introduction to the Baha'i Faith. Cambridge UP."
    secondary: ["Cole, Juan 1998. Modernity and the Millennium. Columbia UP."]
    notes: "Bahá'í progressive-revelation category. INCLUDES but EXCEEDS Abrahamic prophet. Bahá'u'lláh, the Báb. The Bahá'í tradition also classes Krishna, Buddha, Zoroaster, Moses, Jesus, Muhammad as Manifestations — see role-description: for cross-tradition recognition. **Replaces v2's prophet-abrahamic for Bahá'í figures** per Auditor A + B 2026-05-31."
    aliases: []

  - id: avatar-hindu
    display: "Avatar (Hindu incarnation, when historicized-person)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Klostermaier, Klaus 2007. A Survey of Hinduism (3rd ed.). SUNY Press."
    notes: "Applies only when a historical-or-quasi-historical figure is venerated as avatar. Mythic full-incarnations (Vishnu's complete ten) are deities in 03_deities/, not persons. Use with caution — controversial across Vaishnava sampradayas. Krishna debated; Kalki eschatological (flag confidence: low)."
    aliases: ["avatar", "incarnation of Vishnu"]

  - id: tirthankara-jain
    display: "Tīrthaṅkara (Jain ford-maker)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Dundas, Paul 2002. The Jains (2nd ed.). Routledge."
    notes: "The 24 Jain Tīrthaṅkaras from Rishabha (cosmological deep time) through Mahavira (-599 to -527). Tradition-internal Jain category; not Western 'founder.'"
    aliases: ["tirthankara", "ford-maker"]

  - id: mahasiddha
    display: "Mahāsiddha (Buddhist tantric perfected-being)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Davidson, Ronald M. 2002. Indian Esoteric Buddhism. Columbia UP."
    secondary: ["White, David Gordon 1996. The Alchemical Body. University of Chicago Press.", "Robinson, James B. 1979. Buddha's Lions: The Lives of the Eighty-Four Siddhas."]
    notes: "The 84 Mahāsiddhas + Nath siddhas. Distinct from bodhisattva-mahayana (philosophical-vow path) and guru-hindu (modern Hindu lineage) and acharya-buddhist (Mahāyāna scholastic). Naropa, Tilopa, Saraha, Virūpa."
    aliases: ["mahasiddha", "Mahāsiddha", "siddha (Buddhist)"]

  - id: acharya-hindu
    display: "Ācārya (Hindu sampradaya-founding doctrinal teacher)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Lipner, Julius 2010. Hindus: Their Religious Beliefs and Practices (2nd ed.). Routledge."
    secondary: ["Mlecko, Joel 1982. 'The Guru in Hindu Tradition.' Numen 29(1).", "Copeman & Ikegame 2012 *The Guru in South Asia*. Routledge."]
    notes: "**CARDINAL: NOT theologian.** Hindu insider category. Sankara (Advaita), Ramanuja (Vishishtadvaita), Madhva (Dvaita), Nimbarka, Vallabha, Chaitanya. Per Auditor B 2026-05-31: forcing Hindu acharyas into Western 'theologian' is exactly the Asad-1993 Christian-categorial imposition the methodological-humility caveat warns against."
    aliases: ["acharya", "ācārya"]

  - id: acharya-jain
    display: "Ācārya (Jain doctrinal teacher)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Dundas 2002 *The Jains*"
    notes: "Digambara/Svetambara doctrinal-teacher lineage. Kundakunda, Umasvati, Hemachandra. Distinct from acharya-hindu."
    aliases: []

  - id: acharya-buddhist
    display: "Ācārya (Mahāyāna scholastic-doctrinal teacher)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Williams, Paul 1989. Mahāyāna Buddhism: The Doctrinal Foundations. Routledge."
    notes: "Asanga, Vasubandhu, Nāgārjuna, Atiśa, Tsongkhapa, Shantideva. Distinct from mahasiddha (tantric path) and bodhisattva-mahayana (vow-category). These are the doctrinal-systematic teachers per Williams 1989."
    aliases: []

  - id: bodhisattva-mahayana
    display: "Bodhisattva (historical Mahāyāna teacher venerated as such)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Williams 1989 *Mahāyāna Buddhism*"
    secondary: ["Davidson 2002 *Indian Esoteric Buddhism*"]
    notes: "BOUNDARY CASE — Davidson 2002 contests historicity of several figures placed here (Padmasambhava). Auditor A 2026-05-31 critique: don't bifurcate 'historicized' vs 'mythic' — let mahasiddha or acharya-buddhist handle most cases. Reserve this token for unambiguous-bodhisattva-veneration cases."
    aliases: []

  - id: tertön-tibetan
    display: "Tertön (Tibetan treasure-revealer)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Cuevas, Bryan 2003. The Hidden History of the Tibetan Book of the Dead. Oxford UP."
    notes: "Tibetan Buddhist terma-discoverer category. Padmasambhava, Karma Lingpa, Dudjom Lingpa."
    aliases: ["tertön", "terton"]

  - id: lineage-master-tibetan
    display: "Lineage Master (Tibetan Vajrayāna)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Samuel, Geoffrey 1993. Civilized Shamans: Buddhism in Tibetan Societies. Smithsonian."
    notes: "Generic Tibetan Vajrayāna lineage-holder when no specific category applies."
    aliases: []

  - id: guru-sikh
    display: "Guru (Sikh — one of the Ten)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "McLeod, W.H. 1989. Who Is a Sikh? Oxford UP."
    notes: "**STRICTLY the 10 Sikh Gurus** (Nanak through Gobind Singh, 1469-1708). Lineage ended with Guru Granth Sahib as the 11th and eternal Guru. **DO NOT extend to modern claimants** (Sant Mat / Radha Soami / Dera Sacha Sauda figures — those go into polemical-framing as Sikh-rejected per insider doctrine)."
    aliases: ["Sikh Guru"]

  - id: guru-hindu
    display: "Guru (Hindu — modern lineage teacher)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Copeman & Ikegame 2012 *The Guru in South Asia*. Routledge."
    secondary: ["Mlecko 1982 'The Guru in Hindu Tradition' Numen 29(1)."]
    notes: "Modern Hindu guru lineages — Ramakrishna, Vivekananda, Aurobindo, Ramana Maharshi, Yogananda, Sai Baba (Shirdi + Sathya), Anandamayi Ma, Nityananda, Muktananda, Mata Amritanandamayi. Per Auditor B 2026-05-31: distinct from guru-sikh; Hindu insiders expect their own token."
    aliases: ["Hindu guru", "sadguru"]

  - id: rishi-vedic
    display: "Ṛṣi (Vedic seer)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Witzel, Michael 1997. Inside the Texts, Beyond the Texts. Harvard Oriental Series."
    secondary: ["Jamison & Brereton 2014. The Rigveda. Oxford UP."]
    notes: "Vedic mantra-drashtara. The Saptarishi, Vasishtha, Vishvamitra, Atri, Bharadvaja. **Distinct from prophet-abrahamic AND acharya-hindu** — receives śruti, not revelation in the Abrahamic sense. Tradition-internal Vedic-Hindu category per Witzel 1997."
    aliases: ["rishi", "ṛṣi", "Vedic seer"]

  - id: oracle
    display: "Oracle (mantic site-specific consulter-of-deity)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Parke & Wormell 1956. The Delphic Oracle. Blackwell."
    secondary: ["Burkert, Walter 1985. Greek Religion. Harvard UP. §III.8."]
    notes: "Pythia of Delphi, Sibyls, Etruscan haruspices. **Distinct from prophet** (prophet = revelation-bearer; oracle = consultation-mantic). Per Auditor A 2026-05-31: treating Pythia as prophet-abrahamic reproduces the Christian-universal flattening Asad 1993 warns against."
    aliases: ["oracle"]

  - id: diviner
    display: "Diviner (sign-reader religious specialist)"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Tedlock, Barbara 1992. Time and the Highland Maya. University of New Mexico Press."
    notes: "Reads-signs religious specialist. Mesoamerican daykeepers, Yijing diviners. Distinct from oracle (which speaks for a god) and from babalawo (which is Ifá-specific and gets its own tradition-specific token below)."
    aliases: ["diviner"]

  - id: gnostic-redeemer-figure
    display: "Gnostic redeemer-figure"
    tier: 1
    figure_qualifying: true
    source-tier: T1
    source: "Williams, Michael Allen 1996. Rethinking 'Gnosticism'. Princeton UP."
    secondary: ["Brakke, David 2010. The Gnostics. Harvard UP.", "Turner, John D. 2001. Sethian Gnosticism and the Platonic Tradition. Peeters.", "King, Karen 2003. What Is Gnosticism? Harvard UP.", "Pearson, Birger A. 2007. Ancient Gnosticism. Fortress."]
    notes: "Cosmic-redeemer / aeon-tier figure within Gnostic theology. Includes the Sethian-cosmic-Seth, Sophia (as cosmic redeemer-figure, not deity-tier), Christ-Logos in Valentinian + Sethian frameworks, Allogenes / the Stranger. Distinct from `prophet-abrahamic` (Gnostic redeemer is cosmic-theological role, not Abrahamic-prophet category). Distinct from deity-tier figures in 03_deities/ which are first-order divine beings. Per Williams 1996 + Brakke 2010 anti-essentialist framing: the role is real WITHIN Gnostic theological discourse even if 'Gnosticism' as a unified category is constructed."
    aliases: ["gnostic redeemer", "Sethian redeemer", "cosmic redeemer-figure (Gnostic)"]

  # ────────────────────────────────────────────────────────────────────────
  # TIER 2 — Religious authority (multi-tradition disambiguated)
  # ────────────────────────────────────────────────────────────────────────

  # Christian
  - id: pope-roman-catholic
    display: "Pope (Roman Catholic, Bishop of Rome)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Duffy, Eamon 2014. Saints and Sinners: A History of the Popes (4th ed.). Yale UP."
    notes: "Strictly the Roman Catholic Pope. NOT to be conflated with pope-coptic (Pope of Alexandria, Coptic Orthodox)."
    aliases: ["Pope", "Roman Catholic Pope", "Bishop of Rome", "Roman Pontiff"]

  - id: pope-coptic
    display: "Pope (Coptic Orthodox, Pope of Alexandria)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Watson, John H. 2000. Coptic Egypt. Mowbray."
    notes: "Tawadros II is the 118th Pope of Alexandria. Institutionally distinct from pope-roman-catholic. Per Auditor B 2026-05-31."
    aliases: ["Pope of Alexandria", "Coptic Pope"]

  - id: patriarch-hebrew
    display: "Patriarch (Hebrew — Abraham / Isaac / Jacob)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Sarna, Nahum 1989. JPS Torah Commentary: Genesis. Jewish Publication Society."
    notes: "Genesis patriarchs (and matriarchs by tradition extension). Multi-tradition homograph: distinct from patriarch-christian-orthodox + patriarch-jewish-late-antique + patriarch-oriental-orthodox."
    aliases: []

  - id: patriarch-jewish-late-antique
    display: "Patriarch (Late-Antique Jewish Patriarchate of Palestine)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Goodman, Martin 1983. State and Society in Roman Galilee. Rowman & Allanheld."
    notes: "Nasi of the Patriarchate (Hillel-the-Elder through Gamaliel VI, ca. 30 BCE–425 CE). Multi-tradition homograph: distinct from patriarch-hebrew + patriarch-christian-orthodox."
    aliases: ["Nasi"]

  - id: patriarch-christian-orthodox
    display: "Patriarch (Eastern Orthodox)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Brown, Peter 1981. The Cult of the Saints. University of Chicago Press."
    notes: "Eastern Orthodox sees: Constantinople (Ecumenical Patriarch — first-among-equals), Antioch, Alexandria-Greek, Jerusalem, Moscow + autocephalous heads. Multi-tradition homograph."
    aliases: ["Patriarch of Constantinople", "Ecumenical Patriarch", "Patriarch of Antioch"]

  - id: patriarch-oriental-orthodox
    display: "Patriarch (Oriental Orthodox — Armenian / Syriac / Ethiopian / Eritrean)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Pummer, Reinhard 2016. The Samaritans: A Profile. Eerdmans. (also: Meinardus 2002 *Two Thousand Years of Coptic Christianity*)"
    notes: "Non-Chalcedonian Oriental Orthodox patriarchates. Distinct from catholicos for Armenian Apostolic + Assyrian Church of the East which have their own title-tradition."
    aliases: []

  - id: catholicos
    display: "Catholicos (Armenian Apostolic + Assyrian Church of the East)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Brock, Sebastian P. 2004. The Hidden Pearl: The Syrian Orthodox Church and its Ancient Aramaic Heritage. Trans World Film. (and tradition-internal references)"
    notes: "Autocephalous non-Chalcedonian sees (Etchmiadzin, Cilicia, Selemiyeh). Per Auditor B 2026-05-31: distinct title-tradition; cannot be forced into patriarch-christian-orthodox."
    aliases: ["Catholicos"]

  - id: bishop-christian
    display: "Bishop (Christian — diocesan + theological authority)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Brown 1981 *Cult of the Saints*"
    notes: "Generic Christian bishop category. Augustine of Hippo, Ambrose of Milan, Basil of Caesarea, etc. Multi-tradition: applies across Latin/Greek/Syriac/Armenian/Coptic episcopacy. For specific Anglican Archbishop of Canterbury level use archbishop-anglican."
    aliases: ["bishop", "Bishop"]

  - id: archbishop-christian
    display: "Archbishop (Christian — provincial see)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Brown 1981; Hardy 1992 *Anglicanism*"
    notes: "Generic Christian archbishop category."
    aliases: ["archbishop", "Archbishop"]

  - id: archbishop-anglican
    display: "Archbishop (Anglican — Canterbury / York)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Hardy, Daniel W. 1992. Anglicanism. (in The Study of Anglicanism, ed. Sykes & Booty)"
    notes: "Senior Anglican Communion role. Specifically Canterbury or York. Per Auditor B 2026-05-31 — Anglican insiders expect this disambiguation."
    aliases: ["Archbishop of Canterbury"]

  - id: pastor-protestant
    display: "Pastor (Protestant ordained minister)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Niebuhr, H. Richard 1956. The Purpose of the Church and Its Ministry. Harper."
    notes: "Lutheran, Reformed, Calvinist, Methodist, etc. ordained ministry. Bonhoeffer, Niebuhr (Reinhold), Tillich-as-pastor, Schleiermacher. Per Auditor A + C 2026-05-31: v2 was missing this entirely; defaulted Protestant pastors to bishop-christian (wrong)."
    aliases: ["Protestant pastor", "Lutheran pastor", "minister"]

  - id: evangelist-gospel-attributed
    display: "Evangelist (the four Gospel-attributed authors)"
    tier: 3
    figure_qualifying: true
    source-tier: T1
    source: "Brown, Raymond E. 1997. An Introduction to the New Testament. Doubleday."
    notes: "Strictly Mark, Matthew, Luke, John as Gospel-authors. Distinct from evangelist-revivalist (Wesley, Whitefield, Graham). Per Auditor B 2026-05-31: term has dual usage; split required."
    aliases: ["evangelist (Gospel author)", "Mark the Evangelist", "Luke the Evangelist"]

  - id: evangelist-revivalist
    display: "Evangelist (Protestant revivalist preacher)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "Hatch, Nathan O. 1989. The Democratization of American Christianity. Yale UP."
    notes: "Wesley, Whitefield, Charles Finney, D.L. Moody, Billy Graham, etc."
    aliases: ["revivalist preacher", "evangelist (revivalist)"]

  - id: doctor-of-the-church
    display: "Doctor of the Church (Catholic ecclesiastical honor)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
    source: "McBrien, Richard P. 1995. Encyclopedia of Catholicism. HarperSanFrancisco."
    notes: "Specific Catholic honor: 37 figures formally proclaimed Doctors of the Church (Aquinas, Augustine, Bonaventure, Teresa of Ávila, Thérèse, Hildegard, etc.). Per Auditor B 2026-05-31: insider-weighted higher than generic theologian; SITS ALONGSIDE theologian in multi-role array (Aquinas = [doctor-of-the-church, theologian, philosopher-religious, monastic-christian-western])."
    aliases: ["Doctor of the Church", "Doctor Ecclesiae"]

  # Islamic
  - id: caliph-sunni
    display: "Caliph (Sunni)"
    tier: 2
    figure_qualifying: true
    source-tier: T1
