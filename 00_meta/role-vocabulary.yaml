    source-tier: T1
    source: "Daftary 2007 *The Ismāʿīlīs*"
    notes: "Bohra (Tayyibi) Ismaili lineage. Fatimid Imam-Caliphs (Mu'izz, Hakim, Mustansir). Distinct from imam-ismaili-nizari."
