    source-tier: T1
    role-description: "Rudolf Otto — Lutheran theologian + comparative-religion phenomenologist; author of *Das Heilige* (1917)."

  john-hick:
    role-tokens: ["scholar-academic-religion", "theologian"]
    rationale: "Ordained Presbyterian + philosophical theologian. Double role qualifying."
    source-tier: T1
    role-description: "John Hick — Presbyterian minister + philosopher of religion; advocate of religious pluralism (Hick 1989 *An Interpretation of Religion*)."

