  guru-nanak:
    role-tokens: ["founder", "guru-sikh"]
    rationale: "Founder of Sikhism + first of the Ten Gurus."
    source-tier: T1
    role-description: "Guru Nanak — founder of Sikhism (1469-1539); first of the Ten Sikh Gurus."

  zoroaster:
