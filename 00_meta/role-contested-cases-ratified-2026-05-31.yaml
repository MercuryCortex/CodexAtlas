  joseph-smith:
    role-tokens: ["founder"]
    rationale: "Per Auditor A 2026-05-31 — DEMOTED from v2's ['founder', 'prophet-abrahamic']. The Abrahamic-prophet category is LDS doctrinal claim; mainstream non-LDS academic religious-studies (Bushman 2005, Brodie 1945, Shipps 1985) treats him as founder of new religious tradition, NOT as prophet in the Abrahamic-line sense. LDS internal framing preserved in role-description prose."
    source-tier: T1
    role-description: "Joseph Smith Jr. — founder of the Church of Jesus Christ of Latter-day Saints (1830). LDS doctrine frames him as 'the Prophet' restoring Abrahamic prophetic line; mainstream academic religious-studies treats him as NRM founder (Bushman 2005, Brodie 1945, Shipps 1985)."

  bahaullah:
    role-tokens: ["founder", "manifestation-bahai"]
    rationale: "Per Auditor A + B 2026-05-31 — REPLACES v2's ['founder', 'prophet-abrahamic']. The Bahá'í 'Manifestation of God' (mazhar-i ilāhī) is theologically distinct from prophet — progressive-revelation category that INCLUDES but EXCEEDS Abrahamic prophets. Smith 2008 + Cole 1998."
    source-tier: T1
