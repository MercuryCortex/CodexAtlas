# Modern religious-studies academics — Tier 5 NON-qualifying by default
contested_cases:

  carl-gustav-jung:
    role-tokens: ["psychologist-of-religion"]
    rationale: "Per Auditor A 2026-05-31 — split scholarship (Shamdasani 2003 + Bishop 2014 academic-only vs Noll 1994 + 1997 cult-founder critique vs Hanegraaff 1996 esotericism reading). Academic-consensus-aligned call: psychologist-of-religion as primary. Contestation captured in polemical-framing."
    source-tier: T1
    polemical-framing:
      - by: "Noll 1994 *The Jung Cult* + 1997 *The Aryan Christ*"
        label: "cult-founder"
        source-tier: T2
        direction: outsider
    role-description: "Carl Gustav Jung — Swiss psychoanalyst; founder of analytical psychology; contested-status figure in NRM-studies (Hanegraaff 1996; Noll 1994/1997)."

  mircea-eliade:
    role-tokens: ["scholar-academic-religion"]
    rationale: "Historian of religion; Wasserstrom 1999 documents Eliade's religious-Orthodox-nationalist commitments alongside the academic work but stops short of figure-qualifying."
    source-tier: T1
    polemical-framing:
      - by: "Wasserstrom 1999 *Religion after Religion*; Ricketts 1988 *Mircea Eliade: The Romanian Roots*"
        label: "religious-advocate-Romanian-Orthodox"
        source-tier: T1
        direction: outsider
    role-description: "Mircea Eliade — historian of religion; held University of Chicago Sewell Avery chair. Iron-Guard / nationalist-Romanian-Orthodox involvement documented by Wasserstrom 1999 + Ricketts 1988."

  gershom-scholem:
    role-tokens: ["scholar-academic-religion"]
    rationale: "Per Auditor A 2026-05-31 — DEMOTED from v2's scholar+philosopher-religious double role. Principle: 'engaged-Jewish-thinker' criterion would also promote Pagels (Quaker), Jonas (Jew), Bellah (Episcopalian) if applied consistently. Choose Tier-5-only here."
    source-tier: T1
    role-description: "Gershom Scholem — founder of academic Kabbalah studies; Hebrew University chair. Religiously-engaged Jewish thinker but professionally a historian."

  william-james:
    role-tokens: ["psychologist-of-religion"]
    rationale: "Pragmatist philosopher; *Varieties of Religious Experience* is academic phenomenology. Hanegraaff 1996 acknowledges Jamesian-influence on Western esotericism but James himself is not figure."
    source-tier: T1
    role-description: "William James — Harvard philosopher and psychologist; author of *The Varieties of Religious Experience* (1902 Gifford Lectures)."

  rudolf-otto:
    role-tokens: ["scholar-academic-religion", "theologian"]
