# Multi-role classical religious figures

  jesus-of-nazareth:
    role-tokens: ["founder", "prophet-abrahamic"]
    rationale: "Academic-neutral framing. Tradition-internal claims (Son of God, Messiah, second person of Trinity) preserved in role-description; Quranic/Islamic ʿĪsā recognition also tradition-internal."
    source-tier: T1
    role-description: "Jesus of Nazareth — founder of Christianity; Hebrew Bible prophet category extended by Christian tradition to Messiah / Son of God / Second Person of the Trinity; Islamic tradition recognizes him as ʿĪsā ibn Maryam (Jesus son of Mary), the next-to-last prophet before Muhammad."

  muhammad:
    role-tokens: ["founder", "prophet-abrahamic", "messenger-islamic"]
    rationale: "Triple-role per Islamic theological distinction: prophet (nabī) + messenger-with-scripture (rasūl) + tradition-founder."
    source-tier: T1
    role-description: "Muhammad ibn Abdullah — founder of Islam; Islamic tradition frames him as the Seal of the Prophets (khātam al-nabiyyīn) and the rasūl-messenger of God."

  buddha:
    role-tokens: ["founder", "acharya-buddhist"]
    rationale: "Founder of Buddhism + later doctrinal-tradition recognition."
    source-tier: T1
    role-description: "Siddhārtha Gautama (the Buddha) — founder of Buddhism; awakening at Bodh Gayā; first sermon at Sarnath."

  mahavira:
    role-tokens: ["tirthankara-jain", "founder"]
    rationale: "24th and final Tīrthaṅkara of this cosmic cycle; founder of historical Jainism."
    source-tier: T1
