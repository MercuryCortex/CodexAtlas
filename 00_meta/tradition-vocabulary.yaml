# Tradition Controlled Vocabulary
#
# Built 2026-05-14 in response to AUDIT/01_integrity_issues.md item #2:
# "Tradition-string normalisation is broken."
#
# Purpose: collapse the ~300 free-text `tradition:` strings used in
# 03_deities/*.md and 04_persons/*.md into a small set of canonical
# IDs grouped by cultural cluster.
#
# Schema for each entry:
#   - id:       lowercase slug (the canonical identifier)
#   - display:  human-readable label for UI / dashboards
#   - cluster:  one of the cluster IDs in `clusters:` below
#   - aliases:  the exact tradition strings observed in node YAML.
#               build_data.py should normalise on these — any tradition
#               string equal to (or starting with) an alias resolves to
#               this id.
#   - notes:    optional commentary on scope boundaries
#
# Frequencies in the alias lists below were derived from
# `grep -h "^tradition:" 03_deities/*.md 04_persons/*.md | sort | uniq -c`
# run on 2026-05-14.
#
# Follow-up work (NOT done in this batch):
#   - build_data.py must be upgraded to consult this file and cluster
#     nodes by canonical id rather than by raw string.
#   - Optionally, a one-shot rewriter could replace every raw alias in
#     node YAML with its canonical id. We do NOT do that in this batch
#     because the rewrite touches several hundred files and should be
#     reviewed downstream.
#   - This file is intentionally not exhaustive: tradition strings
#     observed exactly once and unambiguously sub-classified (e.g.
#     "Patristic Christian (Quartodeciman Asian)") collapse to their
#     obvious parent id by prefix-match. Aliases below capture the
#     high-frequency forms and the ambiguous cases.

clusters:
