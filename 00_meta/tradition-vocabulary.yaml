    display: "Ancient Near East (Mesopotamia & periphery)"
  - id: levant
    display: "Levant / Canaanite / Israelite-Judahite"
  - id: egypt
    display: "Egyptian (Pharaonic)"
  - id: hellenic
    display: "Greek (archaic, classical, Hellenistic, philosophical)"
  - id: roman
    display: "Roman (state cult, philosophical, syncretic mystery cults)"
  - id: persian-iranian
    display: "Persian / Iranian (Zoroastrian, Manichaean, Mandaean)"
  - id: abrahamic
    display: "Abrahamic mainstream (Judaism, Christianity, Islam, Baha'i)"
  - id: gnostic
    display: "Gnostic / heterodox-Christian / dualist movements"
  - id: esoteric-western
    display: "Western esoteric (Hermeticism, Kabbalah, Theosophy, magick, Rosicrucian)"
  - id: indic
    display: "South Asian (Vedic, Hindu, Jain, Sikh, Indian Buddhist)"
  - id: buddhist
    display: "Buddhism (pan-traditional, Theravada, Mahayana, Vajrayana, Zen, Pure Land)"
  - id: sinic
    display: "Chinese (Daoist, Confucian, Chinese popular religion, Chinese Buddhist)"
  - id: japonic
    display: "Japanese (Shinto, Japanese Buddhism)"
  - id: indigenous-european-pre-christian
    display: "Pre-Christian European (Norse, Celtic, Slavic, Finno-Karelian)"
