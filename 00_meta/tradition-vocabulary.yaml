# ----------------------------------------------------------------
# Notes on intentionally NOT-yet-mapped strings
# ----------------------------------------------------------------
#
# A handful of observed tradition strings span multiple clusters and
# resist single-bucket assignment. The intended resolution is that
# build_data.py, when it gains vocabulary support, will accept multiple
# `cluster` memberships per node by reading the canonical id list. The
# strings below are *deliberately* not folded into a single id; in the
# downstream rewriter we will split them into a list of canonical ids:
#
#   - "Hebrew Bible; Christian Bible; Quran; Sethian and Valentinian
#      Gnosticism; Hermetism; Kabbalah; Mandaeism"
#     → [israelite-judahite, christian-generic, islam-generic,
#        sethian-gnostic, valentinian-gnostic, hermeticism, kabbalah,
#        mandaean]
#
#   - "Hebrew Bible; Sethian Gnostic Christianity; Mandaeism (as Šitil);
#      Islam"
#     → [israelite-judahite, sethian-gnostic, mandaean, islam-generic]
#
# These multi-tradition strings appear on a small number of cross-corpus
# concept-figures (e.g. Adam, Seth) where the single-tradition model
# breaks down by design. They are a feature, not a bug. The downstream
# rewriter must NOT collapse them into a single id.
