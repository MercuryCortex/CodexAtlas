<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0d1119"/>
  <!-- scroll body -->
  <rect x="148" y="52" width="104" height="136" rx="2" fill="none" stroke="#d4a55a" stroke-width="1.5" opacity="0.65"/>
  <!-- top rolled edge -->
  <ellipse cx="200" cy="52" rx="52" ry="10" fill="#0d1119" stroke="#d4a55a" stroke-width="1.5" opacity="0.65"/>
  <!-- bottom rolled edge -->
  <ellipse cx="200" cy="188" rx="52" ry="10" fill="#0d1119" stroke="#d4a55a" stroke-width="1.5" opacity="0.65"/>
  <!-- text lines inside scroll -->
  <g stroke="#2e3a50" stroke-width="1" opacity="0.9">
    <line x1="166" y1="82"  x2="234" y2="82"/>
    <line x1="166" y1="94"  x2="234" y2="94"/>
    <line x1="166" y1="106" x2="234" y2="106"/>
    <line x1="166" y1="118" x2="210" y2="118"/>
    <line x1="166" y1="138" x2="234" y2="138"/>
    <line x1="166" y1="150" x2="234" y2="150"/>
    <line x1="166" y1="162" x2="200" y2="162"/>
  </g>
  <!-- scroll rod caps -->
  <g fill="#d4a55a" opacity="0.45">
    <circle cx="148" cy="52"  r="5"/>
    <circle cx="252" cy="52"  r="5"/>
    <circle cx="148" cy="188" r="5"/>
    <circle cx="252" cy="188" r="5"/>
  </g>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a5e6a" letter-spacing="3">DOCUMENT</text>
</svg>
