<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0d1119"/>
  <!-- outer halo ring -->
  <circle cx="200" cy="112" r="74" fill="none" stroke="#1c2333" stroke-width="1"/>
  <!-- middle ring -->
  <circle cx="200" cy="112" r="52" fill="none" stroke="#232b3d" stroke-width="1"/>
  <!-- inner circle -->
  <circle cx="200" cy="112" r="22" fill="none" stroke="#d4a55a" stroke-width="1.5" opacity="0.7"/>
  <!-- 8 rays (cardinal + diagonal) -->
  <g stroke="#d4a55a" stroke-width="1.2" opacity="0.55">
    <line x1="200" y1="90"  x2="200" y2="38"/>
    <line x1="200" y1="134" x2="200" y2="186"/>
    <line x1="178" y1="112" x2="126" y2="112"/>
    <line x1="222" y1="112" x2="274" y2="112"/>
    <line x1="184" y1="96"  x2="149" y2="61"/>
    <line x1="216" y1="96"  x2="251" y2="61"/>
    <line x1="184" y1="128" x2="149" y2="163"/>
    <line x1="216" y1="128" x2="251" y2="163"/>
  </g>
  <!-- central dot -->
  <circle cx="200" cy="112" r="4" fill="#d4a55a" opacity="0.8"/>
  <!-- ray-tip diamonds -->
  <g fill="#d4a55a" opacity="0.5">
    <polygon points="200,34 203,40 200,46 197,40"/>
    <polygon points="200,190 203,184 200,178 197,184"/>
    <polygon points="122,112 128,109 134,112 128,115"/>
    <polygon points="278,112 272,109 266,112 272,115"/>
  </g>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a5e6a" letter-spacing="3">DEITY</text>
</svg>
