<script src="_ft-data.js"></script>
<script>
(function(){
/* ══ THE TWO BANDS AND THE CIRCLE (2026-08-01) ══════════════════════
   John: "i want the 2 bands we using right? and the central circle
   proportions where all the elements we have currently have."

   So this is not a sketch of a frame — it is THE frame, drawn from the
   layout's own radial budget (familytree.js §"WHERE THE GROUND IS
   GIVEN"). Every number is lifted, and the ones that are SOLVED are
   solved here the same way they are solved there:

     portR   = Rh x portInset                        (house_port_inset 1.00)
     ceiling = portR - mBandPort(12) - capText(10)
                     - capTier(30) - capClear(10)
     rC      = min(bandR x Rh, ceiling - thick/2)    (house_band_r 0.86)
     thick   = rows x pitch                          (3 x 16 = 48 wu)
     RtMax   = rC - thick/2 - mTreeBand(16)
     Rt      = min(treeR x Rh, RtMax)                (house_tree_r 0.86)

   Which is why the band does NOT sit at 0.86 even though the dial says
   0.86: the ceiling binds first. The dial is a request; the budget is
   the answer. That gap is the thing worth looking at here.

   BAND 1 is the ports ring — the other families, the horizon.
   BAND 2 is the Scriptorium (left) + Court (right), gapped at 12 and 6.
   THE CIRCLE inside them is the tree zone, where the cascade and the
   fan live. Nothing here reads vault data.
═══════════════════════════════════════════════════════════════════ */

var RH = 540;                       // the house radius, world units
var M_BAND_PORT = 12, CAP_TEXT = 10, CAP_TIER = 30, CAP_CLEAR = 10, M_TREE_BAND = 16;

var R = { port:1.00, band:0.86, rows:3, pitch:16, gapTop:24, gapBot:12, tree:0.74,
          notes:true, caps:false,
          mode:'cascade', lines:4, span:0.94, arc:108, r1:0.30, r2:0.92, bear:-140, inset:14,
          follow:0, reach:0.62, dens:0.85, fam:'Norse', gods:true, bandGlyphs:true, realDates:true,
          axis:true, showLines:true };

/* The demo strata. Four, because four is what he asked to design for,
   and they are deliberately UNEVEN in length — a template that only
   works on strings of equal width is not a template. */
var DEMO = ['700–300 BCE', '1500 BCE–1000 CE', '300 BCE–300 CE', 'UNDATED'];

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var dpr = Math.min(2, window.devicePixelRatio||1);
var W=0, H=0;
var MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace';
var SERIF='"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';

function fit(){
  var barH = document.querySelector('.bars').getBoundingClientRect().height;
  var recH = document.querySelector('.recipe').getBoundingClientRect().height;
  cv.style.height = Math.max(320, Math.round(window.innerHeight - barH - recH)) + 'px';
  var w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr || cv.height!==h*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=w; H=h;
}

/* THE RADIAL BUDGET, solved outside-in — one function, so the drawing
   and the readout can never disagree about where anything is. */
function budget(){
  var portR   = RH * R.port;
  var thick   = R.rows * R.pitch;
  var ceiling = portR - M_BAND_PORT - CAP_TEXT - CAP_TIER - CAP_CLEAR;
  var wanted  = RH * R.band;
  var rC      = Math.min(wanted, ceiling - thick/2);
  var rIn     = rC - thick/2, rOut = rC + thick/2;
  var RtMax   = rIn - M_TREE_BAND;
  var Rt      = Math.min(RH * R.tree, RtMax);
  return { portR:portR, thick:thick, ceiling:ceiling, wanted:wanted, rC:rC,
           rIn:rIn, rOut:rOut, RtMax:RtMax, Rt:Rt,
           bound:(wanted > ceiling - thick/2), treeBound:(RH*R.tree > RtMax) };
}

/* A band is an annulus BROKEN at 12 and 6 o'clock, the way the house
   breaks its own: the top gap protects the title column, the bottom
   only has to clear the cascade's foot, so it is the smaller. */
function bandArcs(gt, gb){
  var TOP=-Math.PI/2, BOT=Math.PI/2;
  return [[TOP+gt, BOT-gb], [BOT+gb, TOP-gt+Math.PI*2]];
}
function arcPath(cx, cy, r, a){ ctx.beginPath(); ctx.arc(cx,cy,r,a[0],a[1]); ctx.stroke(); }

function draw(){
  fit();
  ctx.clearRect(0,0,W,H);
  var b = budget();
  var cx = W/2, cy = H/2;
  var s  = (Math.min(W,H)/2 - 30) / Math.max(b.portR, RH);   // wu -> px
  var gt = R.gapTop*Math.PI/180, gb = R.gapBot*Math.PI/180;
  var arcs = bandArcs(gt, gb);
  var P = function(wu){ return wu * s; };

  // ── BAND 1 · THE PORTS RING — the other families, the horizon.
  // A closed circle: the horizon has no gap, you can leave in any
  // direction.
  ctx.strokeStyle='rgba(211,184,119,.34)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx, cy, P(b.portR), 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(211,184,119,.55)';
  for(var k=0;k<36;k++){                       // the ports themselves, rhythm only
    var a = -Math.PI/2 + k*Math.PI*2/36;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*P(b.portR), cy+Math.sin(a)*P(b.portR), 1.6, 0, 7); ctx.fill();
  }

  // the caption annulus the band reserves outboard of itself
  if(R.caps){
    ctx.setLineDash([2,5]); ctx.strokeStyle='rgba(145,138,180,.30)';
    arcs.forEach(function(a){ arcPath(cx,cy,P(b.rOut+CAP_CLEAR),a); });
    arcs.forEach(function(a){ arcPath(cx,cy,P(b.rOut+CAP_CLEAR+CAP_TIER),a); });
    ctx.setLineDash([]);
  }

  // ── BAND 2 · SCRIPTORIUM + COURT — gapped at 12 and 6.
  arcs.forEach(function(a){
    ctx.beginPath();
    ctx.arc(cx, cy, P(b.rOut), a[0], a[1]);
    ctx.arc(cx, cy, P(b.rIn),  a[1], a[0], true);
    ctx.closePath();
    ctx.fillStyle='rgba(211,184,119,.055)'; ctx.fill();
    ctx.strokeStyle='rgba(211,184,119,.40)'; ctx.lineWidth=1; ctx.stroke();
  });
  // its sub-rows — what "3 rows of docs" actually means on the ring
  ctx.strokeStyle='rgba(211,184,119,.18)';
  for(var i=0;i<R.rows;i++){
    var rr = b.rIn + R.pitch*(i+0.5);
    arcs.forEach(function(a){ arcPath(cx,cy,P(rr),a); });
  }

  // ── THE CIRCLE · THE TREE ZONE — cascade and fan live in here.
  ctx.strokeStyle='rgba(233,229,244,.28)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx, cy, P(b.Rt), 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle='rgba(145,138,180,.35)';
  ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI*2); ctx.fill();

  var pack = famPack();
  drawBandGlyphs(cx, cy, P, b, pack);
  drawDateLines(cx, cy, P, b, pack);

  // ── NOTES — the four numbers that are constructed, not dialled.
  if(R.notes){
    ctx.font='500 8.5px '+MONO; ctx.textAlign='left'; ctx.textBaseline='middle';
    // Callouts leave the ring on ONE bearing — up and to the right, at
    // 32°, which is inside the band's own arc and clear of both gaps —
    // and land in a single gutter. A leader that crosses the drawing to
    // reach a label is a leader that has become the drawing.
    var BEAR = -32 * Math.PI/180;
    var gutX = Math.min(W - 210, cx + P(b.portR) + 26);
    // The tree zone sits 16wu inside the band, which is ~8px on this
    // bearing — closer than the type is tall. The dot stays on the ring
    // where it belongs; only the LABEL steps down to stay readable, and
    // the leader bends to show it did.
    var lastY = -1e9, PITCH = 13;
    var mark = function(r, txt, col){
      var px = cx + Math.cos(BEAR)*P(r), py = cy + Math.sin(BEAR)*P(r);
      var ly = Math.max(py, lastY + PITCH); lastY = ly;
      ctx.strokeStyle='rgba(145,138,180,.28)'; ctx.lineWidth=1;
      ctx.setLineDash([1,3]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(gutX - 6, ly); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(145,138,180,.55)';
      ctx.beginPath(); ctx.arc(px, py, 1.6, 0, 7); ctx.fill();
      ctx.fillStyle = col;
      ctx.fillText(txt, gutX, ly);
    };
    mark(b.portR, 'PORTS  ' + Math.round(b.portR) + 'wu', 'rgba(211,184,119,.85)');
    mark(b.rOut,  'band outer  ' + Math.round(b.rOut) + 'wu', 'rgba(211,184,119,.60)');
    mark(b.rC,    'BAND  ' + Math.round(b.rC) + 'wu  (' + (b.rC/RH).toFixed(3) + '×)'
                  + (b.bound ? '  ← ceiling binds' : ''), 'rgba(211,184,119,.85)');
    mark(b.rIn,   'band inner  ' + Math.round(b.rIn) + 'wu', 'rgba(211,184,119,.60)');
    mark(b.Rt,    'TREE ZONE  ' + Math.round(b.Rt) + 'wu  (' + (b.Rt/RH).toFixed(3) + '×)'
                  + (b.treeBound ? '  ← lane binds' : ''), 'rgba(233,229,244,.80)');
  }
}

/* ══ THE LIVE FAMILY ════════════════════════════════════════════════
   Real packs, shared with design/family-tree.html through _ft-data.js —
   one copy of the data, so the two toys can never disagree about what
   Norse is. A deity is [id, name, date, degree, domain]; a band item is
   [id, name, date, kind, degree].

   The ranking is deliberately the SIMPLEST honest one — era, split
   evenly across the lines, undated to the last — because the point of
   this toy is the FRAME. The real engine's packing is not being
   re-implemented here and must not be mistaken for it.
═══════════════════════════════════════════════════════════════════ */
function famPack(){
  return (R.fam && window.FT_DATA && window.FT_DATA.packs[R.fam]) || null;
}
function fmtY(v){ return v < 0 ? (-v) + ' BCE' : v + ' CE'; }
function rankRows(pack, n){
  var ds = pack.deities, dmin = 1e9, dmax = -1e9;
  ds.forEach(function(d){ if(d[2]!=null){ if(d[2]<dmin) dmin=d[2]; if(d[2]>dmax) dmax=d[2]; } });
  var rows = []; for(var i=0;i<n;i++) rows.push([]);
  ds.forEach(function(d){
    var r = (d[2]==null) ? n-1
          : Math.round((d[2]-dmin)/Math.max(1, dmax-dmin)*(n-1));
    rows[Math.max(0, Math.min(n-1, r))].push(d);
  });
  return rows;
}
function eraOf(row){
  var a=null, b=null;
  row.forEach(function(d){ if(d[2]==null) return;
    if(a==null||d[2]<a) a=d[2]; if(b==null||d[2]>b) b=d[2]; });
  if(a==null) return 'UNDATED';
  if(a===b) return fmtY(a);
  // same era on both ends ⇒ say the unit once: "700–300 BCE", not
  // "700 BCE–300 BCE". The app's own caption law.
  if(a<0 && b<0) return (-a) + '–' + (-b) + ' BCE';
  if(a>=0 && b>=0) return a + '–' + b + ' CE';
  return (-a) + ' BCE–' + b + ' CE';
}
function godR(deg){ return 2.6 + Math.min(9, Math.sqrt(Math.max(0,deg)) * 0.85); }
/* ORGANIC, NOT RIGID (John: "the disposition of the gods needs to be
   the SAME as before meaning organic, not rigid on the lines").
   A rank is a BED, not a queue: its members alternate between sub-rows
   either side of the line and the biggest sit toward the middle, which
   is what stops a row of 31 reading as a ruler. Deterministic — the
   same family always draws the same way. This is a STAND-IN for the
   real bed solver, not a second copy of it. */
function bedOrder(row){
  var by = row.slice().sort(function(a,b){ return (b[3]||0)-(a[3]||0); });
  var out = [], L = [], Rr = [];
  by.forEach(function(d,i){ (i%2 ? L : Rr).push(d); });
  out = L.reverse().concat(Rr);                 // biggest in the middle
  return out;
}
function subOf(i){ return (i % 2) ? 1 : -1; }   // which side of the line
function drawGod(x, y, r, col){
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(233,229,244,.80)'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(x, y, r+2.2, 0, Math.PI*2); ctx.stroke();
}

/* THE BAND, LIVE — documents take the left flank (the Scriptorium),
   everything else the right (the Court), laid along the sub-rows the
   band already declares. This is what the band's thickness is FOR. */
function drawBandGlyphs(cx, cy, P, b, pack){
  if(!pack || !R.bandGlyphs) return;
  var gt = R.gapTop*Math.PI/180, gb = R.gapBot*Math.PI/180;
  var docs = [], court = [];
  (pack.court||[]).forEach(function(c){ (c[3]==='doc' ? docs : court).push(c); });
  var sides = [
    { items: docs,  a0:  Math.PI/2 + gb, a1: 1.5*Math.PI - gt },   // left, down->up
    { items: court, a0: -Math.PI/2 + gt, a1: Math.PI/2 - gb },     // right, up->down
  ];
  var glyphR = Math.max(1.4, P(R.pitch) * 0.24);
  sides.forEach(function(sd){
    var m = sd.items.length; if(!m) return;
    var perRow = Math.ceil(m / R.rows);
    sd.items.forEach(function(it, k){
      var sub = k % R.rows, col = Math.floor(k / R.rows);
      var t = (perRow<=1) ? 0.5 : (col + 0.5)/perRow;
      var a = sd.a0 + (sd.a1 - sd.a0)*t;
      var rr = P(b.rIn) + P(R.pitch)*(sub + 0.5);
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr, glyphR, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(211,184,119,.80)'; ctx.fill();
    });
  });
}

/* ══ THE DATE LINES — one template, two modes ═══════════════════════
   John: "the lines of dates GOES off the center of their spot, they
   should be circular that is INSIDE and centred on their PERIMETER."

   What is wrong today is not WHERE each date is, it is that each date
   is placed relative to ITS OWN line's end. The cascade's rows are
   different widths and the fan's rings are different radii, so every
   date lands somewhere else and the set reads as a staircase instead
   of a column.

   THE TEMPLATE, therefore, is one rule for both modes:

     · every stratum is a LINE — a chord in cascade, an ARC in fan;
     · every date sits ON its own line, centred across the stroke, so
       it belongs to that stratum and no other;
     · every date shares ONE anchor with all the others — a vertical
       gutter in cascade, a single BEARING in fan — so the four of
       them form an AXIS you can read down.

   The anchor is chosen so it lies on EVERY line: in cascade that is
   the narrowest chord's own end, in fan it is a bearing inside every
   arc's span. A date can then never be off its line, and never off
   the axis, at the same time.
═══════════════════════════════════════════════════════════════════ */
/* ══ SLOTS BY DENSITY, NODES THAT FLOW ══════════════════════════════
   John: "the lines of the dates dont need to split in perfect splits —
   they should distribute according to the density of nodes or values so
   we are not creating empty spaces because theres a line date with 2
   nodes, that should be compressed"  and  "the nodes can NEVER clutter,
   they should flow nicely, NO NEED TO BE accute to the line, is all a
   guide, big concentrations of nodes will naturally spread."

   Two rules, and they are the same rule twice:

   1 ▸ A RANK'S SLOT IS PAID FOR BY ITS POPULATION. Space is shared out
       by count^density, not evenly. density 0 = the old even split;
       1 = strictly proportional (a 60-god rank gets 30× a 2-god rank,
       which over-corrects); 0.62 is the middle where a crowd gets room
       and a pair gets a hairline instead of a quarter of the circle.

   2 ▸ THE LINE IS A GUIDE, NOT A RAIL. A rank takes as many sub-rows
       as it needs to keep its gods off each other, spread through the
       slot its population just bought. Nodes are never forced onto the
       line, and they can never collide, because the row count is
       DERIVED from how many will fit — not fixed at two.

   Both modes, one function: cascade spends the slot in Y, fan spends it
   in radius. That is the only difference between them.
═══════════════════════════════════════════════════════════════════ */
function slotsFor(rows, total, runPx, rPx, minPx){
  // A SLOT IS ITS CONTENT, NOT A SHARE OF THE BAND.
  //
  // First cut weighted by raw count and only MOVED the empty space.
  // Second cut weighted by rows-needed but still spent the WHOLE band,
  // so a rank holding one god was handed a fifth of the circle and left
  // it blank — John, correctly: "all the same".
  //
  // A rank's natural height is the rows it needs plus room for its own
  // date, and nothing more. The stack is then as tall as its contents
  // and sits CENTRED, so the band is a ceiling rather than a target and
  // a sparse rank is genuinely compressed. The dial blends from the old
  // even split (0) to that natural height (1); it only ever scales DOWN
  // to fit, never up, because scaling up is how the air comes back.
  var per   = Math.max(1, Math.floor(runPx / (rPx*2.5)));
  var pitch = rPx*2.4;
  var even  = total / Math.max(1, rows.length);
  var h = rows.map(function(r){
    var need = Math.max(1, Math.ceil(Math.max(1, r.length) / per));
    var nat  = Math.max(minPx || 0, need*pitch + (minPx || 0));
    return even + (nat - even) * R.dens;
  });
  var sum = h.reduce(function(a2,b2){ return a2+b2; }, 0) || 1;
  if(sum > total){ var k = total/sum; h = h.map(function(v){ return v*k; }); sum = total; }
  var out = [], acc = (total - sum)/2;          // centred in the band
  for(var i=0;i<h.length;i++){
    out.push({ lo:acc, hi:acc+h[i], mid:acc+h[i]/2, h:h[i] });
    acc += h[i];
  }
  out.total = sum;
  return out;
}
/* How many sub-rows this rank needs so nothing touches, and the pitch
   between them. Derived from the room it has and the room it needs. */
function bedRows(count, runPx, slotPx, rPx){
  if(count <= 1) return { rows:1, pitch:0 };
  var per = Math.max(1, Math.floor(runPx / (rPx*2.5)));
  var rows = Math.max(1, Math.ceil(count / per));
  var maxRows = Math.max(1, Math.floor(slotPx / (rPx*2.2)));
  rows = Math.min(rows, Math.max(1, maxRows));
  var pitch = (rows > 1) ? Math.min(rPx*2.4, slotPx/rows) : 0;
  return { rows:rows, pitch:pitch };
}

function drawDateLines(cx, cy, P, b, pack){
  var Rt = P(b.Rt), n = R.lines, inset = P(R.inset);
  var rows = (pack && R.realDates) ? rankRows(pack, n) : null;
  var col  = (pack && pack.color) || '#d3b877';
  var lab  = function(i){ return rows ? eraOf(rows[i]) : DEMO[i % DEMO.length]; };
  var counts = rows ? rows.map(function(r){ return r.length; })
                    : new Array(n).fill(1);
  ctx.font='500 9px '+MONO;
  ctx.textBaseline='middle';

  if(R.mode === 'cascade'){
    // the stack spends a band of height 2·reach·Rt, shared by density
    var H = 2*R.reach*Rt, top = cy - R.reach*Rt;
    var sl = slotsFor(rows || counts.map(function(c){ return {length:c}; }), H,
                      2*Rt*R.span, P(9), 20);
    var ys = [], halves = [];
    for(var i=0;i<n;i++){
      var y = top + sl[i].mid;
      ys.push(y);
      var dy = y - cy;
      halves.push(Math.sqrt(Math.max(0, Rt*Rt - dy*dy)) * R.span);
    }
    if(R.showLines){
      ctx.strokeStyle='rgba(233,229,244,.20)'; ctx.lineWidth=1;
      for(var j=0;j<n;j++){
        ctx.beginPath();
        ctx.moveTo(cx - halves[j], ys[j]); ctx.lineTo(cx + halves[j], ys[j]);
        ctx.stroke();
      }
    }
    // THE ANCHOR IS A SLIDER, not a switch. 0 = one straight gutter
    // (a 90° cut against a round frame); 1 = each date at its own
    // line's end, so the column takes the circle's curve. Anything
    // between is a blend of the two.
    var narrow = Math.min.apply(null, halves);
    var xs = [];
    for(var q=0;q<n;q++) xs.push(cx - (narrow + (halves[q]-narrow)*R.follow) + inset);
    if(R.axis){
      ctx.setLineDash([2,4]); ctx.strokeStyle='rgba(211,184,119,.28)';
      ctx.beginPath();
      for(var t2=0;t2<n;t2++){ if(t2===0) ctx.moveTo(xs[t2], ys[t2]); else ctx.lineTo(xs[t2], ys[t2]); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.textAlign='left'; ctx.fillStyle='rgba(211,184,119,.90)';
    var labW = [];
    for(var k=0;k<n;k++){
      var tx = lab(k);
      labW.push(xs[k] + ctx.measureText(tx).width);
      ctx.fillText(tx, xs[k], ys[k]);
    }
    if(rows && R.gods){
      for(var g=0; g<n; g++){
        var row = bedOrder(rows[g]); if(!row.length) continue;
        var x0 = labW[g] + 14, x1 = cx + halves[g] - 8, run = Math.max(10, x1-x0);
        var rAvg = row.reduce(function(a3,d3){ return a3 + godR(d3[3]); }, 0)/row.length;
        var bd = bedRows(row.length, run, sl[g].h, rAvg);
        var per = Math.ceil(row.length / bd.rows);
        for(var qq=0; qq<row.length; qq++){
          var sub = qq % bd.rows, cIdx = Math.floor(qq / bd.rows);
          var u = (per<=1) ? 0.5 : cIdx/(per-1);
          var yy = ys[g] + (sub - (bd.rows-1)/2) * bd.pitch;
          drawGod(x0 + run*u, yy, godR(row[qq][3]), col);
        }
      }
    }
    return;
  }

  // ── FAN — the same two rules, spent in RADIUS.
  var band = Rt*(R.r2 - R.r1), r0 = Rt*R.r1;
  var slF = slotsFor(rows || counts.map(function(c){ return {length:c}; }), band,
                     Rt*(R.arc*Math.PI/180)*1.4, P(9), 20);
  var rs = [];
  for(var m=0;m<n;m++) rs.push(r0 + slF[m].mid);

  var HW = R.arc*Math.PI/180;
  var full = HW >= Math.PI - 1e-6;
  var br = R.bear*Math.PI/180;
  if(!full){
    var bw = Math.atan2(Math.sin(br + Math.PI/2), Math.cos(br + Math.PI/2));
    bw = Math.max(-HW + 0.06, Math.min(HW - 0.06, bw));
    br = -Math.PI/2 + bw;
  }
  if(R.showLines){
    ctx.strokeStyle='rgba(233,229,244,.20)'; ctx.lineWidth=1;
    rs.forEach(function(r){
      ctx.beginPath();
      if(full) ctx.arc(cx, cy, r, 0, Math.PI*2);
      else     ctx.arc(cx, cy, r, -Math.PI/2-HW, -Math.PI/2+HW);
      ctx.stroke();
    });
  }
  if(R.axis){
    ctx.setLineDash([2,4]); ctx.strokeStyle='rgba(211,184,119,.28)';
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(br)*(rs[0]-18), cy + Math.sin(br)*(rs[0]-18));
    ctx.lineTo(cx + Math.cos(br)*(rs[n-1]+18), cy + Math.sin(br)*(rs[n-1]+18));
    ctx.stroke(); ctx.setLineDash([]);
  }
  var west = Math.cos(br) < 0;
  ctx.textAlign = west ? 'right' : 'left';
  ctx.fillStyle='rgba(211,184,119,.90)';
  var labA = [];
  rs.forEach(function(r, idx){
    var px = cx + Math.cos(br)*r, py = cy + Math.sin(br)*r;
    var tx2 = -Math.sin(br), ty2 = Math.cos(br);
    if(!west){ tx2 = -tx2; ty2 = -ty2; }
    var t3 = lab(idx);
    ctx.fillText(t3, px + tx2*inset, py + ty2*inset);
    labA.push((inset + ctx.measureText(t3).width + 10) / Math.max(1, r));
  });
  if(rows && R.gods){
    rs.forEach(function(r, idx){
      var row2 = bedOrder(rows[idx]); if(!row2.length) return;
      var lo2, hi2;
      if(full){ lo2 = br + labA[idx]; hi2 = br + Math.PI*2 - 0.12; }
      else {
        var s0 = -Math.PI/2 - HW, s1 = -Math.PI/2 + HW;
        if(west){ lo2 = br + labA[idx]; hi2 = s1 - 0.04; }
        else    { lo2 = s0 + 0.04;      hi2 = br - labA[idx]; }
      }
      if(hi2 <= lo2) return;
      var runA = (hi2-lo2)*r;
      var rAvg2 = row2.reduce(function(a4,d4){ return a4 + godR(d4[3]); }, 0)/row2.length;
      var bd2 = bedRows(row2.length, runA, slF[idx].h, rAvg2);
      var per2 = Math.ceil(row2.length / bd2.rows);
      for(var z=0; z<row2.length; z++){
        var sub2 = z % bd2.rows, c2 = Math.floor(z / bd2.rows);
        var u2 = (per2<=1) ? 0.5 : c2/(per2-1);
        var a2 = lo2 + (hi2-lo2)*u2;
        var rr2 = r + (sub2 - (bd2.rows-1)/2) * bd2.pitch;
        drawGod(cx + Math.cos(a2)*rr2, cy + Math.sin(a2)*rr2, godR(row2[z][3]), col);
      }
    });
  }
}

function syncRecipe(){
  var b = budget();
  document.getElementById('v-port').textContent  = R.port.toFixed(2)+'×';
  document.getElementById('v-band').textContent  = R.band.toFixed(3)+'×';
  document.getElementById('v-rows').textContent  = R.rows;
  document.getElementById('v-pitch').textContent = R.pitch+'wu';
  document.getElementById('v-gt').textContent    = R.gapTop+'°';
  document.getElementById('v-gb').textContent    = R.gapBot+'°';
  document.getElementById('v-tree').textContent  = R.tree.toFixed(3)+'×';
  document.getElementById('v-lines').textContent = R.lines;
  document.getElementById('v-span').textContent  = R.span.toFixed(2)+'×';
  document.getElementById('v-arc').textContent   = (R.arc>=180?'full':R.arc+'°');
  document.getElementById('v-follow').textContent = R.follow.toFixed(2);
  document.getElementById('v-reach').textContent  = R.reach.toFixed(2)+'×';
  document.getElementById('v-dens').textContent   = R.dens.toFixed(2);
  document.getElementById('v-r1').textContent    = R.r1.toFixed(2)+'×';
  document.getElementById('v-r2').textContent    = R.r2.toFixed(2)+'×';
  document.getElementById('v-bear').textContent  = R.bear+'°';
  document.getElementById('v-inset').textContent = R.inset+'wu';
  var pk = famPack();
  document.getElementById('recipeTxt').innerHTML =
      (pk ? '<b>' + R.fam.toUpperCase() + '</b> ' + pk.deities.length + ' gods · '
            + (pk.court||[]).length + ' band items · ' + pk.kin.length + ' arcs<br>' : '')
    + '<b>BUDGET</b> Rh ' + RH + 'wu · ports ' + Math.round(b.portR) + ' · ceiling ' + Math.round(b.ceiling)
    + ' = ports −' + M_BAND_PORT + ' −' + CAP_TEXT + ' −' + CAP_TIER + ' −' + CAP_CLEAR
    + ' · band asked ' + Math.round(b.wanted) + ' → <b>got ' + Math.round(b.rC) + '</b>'
    + (b.bound ? ' (ceiling binds)' : ' (dial holds)')
    + ' · thickness ' + b.thick + ' (' + R.rows + '×' + R.pitch + ')'
    + ' · band inner ' + Math.round(b.rIn) + ' −' + M_TREE_BAND + ' = lane ' + Math.round(b.RtMax)
    + ' · tree asked ' + Math.round(RH*R.tree) + ' → <b>got ' + Math.round(b.Rt) + '</b>'
    + (b.treeBound ? ' (lane binds)' : ' (dial holds)')
    + '<br><b>GAPS</b> ' + R.gapTop + '° a side at 12 o\'clock · ' + R.gapBot + '° a side at 6'
    + ' — the top gap protects the title column, the bottom only clears the cascade\'s foot';
}

[['port','port'],['band','band'],['rows','rows'],['pitch','pitch'],
 ['gt','gapTop'],['gb','gapBot'],['tree','tree']].forEach(function(p){
  var el = document.getElementById('r-'+p[0]);
  el.addEventListener('input', function(){ R[p[1]] = +el.value; syncRecipe(); draw(); });
});
['lines','span','arc','r1','r2','bear','inset','follow','reach','dens'].forEach(function(k){
  var el = document.getElementById('r-'+k);
  el.addEventListener('input', function(){ R[k] = +el.value; syncRecipe(); draw(); });
});
document.querySelectorAll('.fchip[data-mode]').forEach(function(bn){
  bn.addEventListener('click', function(){
    R.mode = bn.getAttribute('data-mode');
    // The only thing the mode changes is HOW MUCH of each ring is
    // drawn. The rings themselves, and their centre, are the same in
    // both — that is what makes it one template and not two.
    document.querySelectorAll('.fchip[data-mode]').forEach(function(x){ x.classList.toggle('on', x===bn); });
    syncRecipe(); draw();
  });
});
// the family chips, built from the shared pack list
(function(){
  var host = document.getElementById('famChips');
  var names = Object.keys((window.FT_DATA && window.FT_DATA.packs) || {});
  ['—'].concat(names).forEach(function(nm){
    var bn = document.createElement('button');
    bn.className = 'fchip' + ((nm===R.fam || (nm==='—' && !R.fam)) ? ' on' : '');
    bn.textContent = nm;
    bn.addEventListener('click', function(){
      R.fam = (nm === '—') ? null : nm;
      host.querySelectorAll('.fchip').forEach(function(x){ x.classList.toggle('on', x===bn); });
      syncRecipe(); draw();
    });
    host.appendChild(bn);
  });
})();
[['notesChip','notes'],['capsChip','caps'],['axisChip','axis'],['linesChip','showLines'],
 ['godsChip','gods'],['bandGlyphChip','bandGlyphs'],
 ['realDatesChip','realDates']].forEach(function(p){
  var bn = document.getElementById(p[0]);
  bn.addEventListener('click', function(){
    R[p[1]] = !R[p[1]]; bn.classList.toggle('on', R[p[1]]); draw();
  });
});
window.addEventListener('resize', function(){ syncRecipe(); draw(); });

syncRecipe(); draw();
window._bandsDebug = { get R(){ return R; }, budget: budget, redraw: draw };
})();
</script>
